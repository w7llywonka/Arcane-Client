name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Arcane Client
        run: ./gradlew clean build --no-daemon

      - name: Build public loader from freshly compiled client
        run: ./gradlew -p loader clean build --no-daemon

      - name: Test Freecam, Freelook, and interface in Minecraft
        run: xvfb-run -a ./gradlew runClientGameTest --no-daemon

      - name: Upload client test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arcane-client-visual-qa-${{ github.sha }}
          path: build/run/clientGameTest/screenshots/*.png
          if-no-files-found: warn

      - name: Upload mod and sources
        uses: actions/upload-artifact@v7
        with:
          name: arcane-client-${{ github.sha }}
          path: |
            build/libs/*.jar
            loader/build/libs/ARCLoader.jar
          if-no-files-found: error
