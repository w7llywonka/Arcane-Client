name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Arcane Client
        run: ./gradlew clean build --no-daemon

      - name: Upload mod and sources
        uses: actions/upload-artifact@v7
        with:
          name: arcane-client-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
