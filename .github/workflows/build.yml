name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Arcane Client
        run: ./gradlew clean build --no-daemon

      - name: Build public loader from freshly compiled client
        run: ./gradlew -p loader clean build --no-daemon

      - name: Upload mod and sources
        uses: actions/upload-artifact@v7
        with:
          name: arcane-client-${{ github.sha }}
          path: |
            build/libs/*.jar
            loader/build/libs/ARCLoader.jar
          if-no-files-found: error

  gametest:
    name: Minecraft tests (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: automation-effects
            tests: nuker,effects
          - name: interface-visuals
            tests: sus,ui,cosmetics,legacy-ui
          - name: camera
            tests: camera
          - name: scanners-session
            tests: scanner,growth,relog
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Minecraft integration tests
        run: xvfb-run -a ./gradlew runClientGameTest --no-daemon "-ParcaneGameTests=${{ matrix.tests }}"

      - name: Upload client test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arcane-client-visual-qa-${{ matrix.name }}-${{ github.sha }}
          path: build/run/clientGameTest/screenshots/*.png
          if-no-files-found: warn
